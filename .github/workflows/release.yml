name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    permissions:
      contents: write # GitHub release with the example component
      id-token: write # npm provenance attestation (and trusted publishing)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run example:build
      - name: Checksums
        working-directory: ts/examples/hello
        run: shasum -a 256 hello.wasm > hello.wasm.sha256
      - name: Attach the example component to the GitHub release
        working-directory: ts/examples/hello
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            hello.wasm hello.wasm.sha256 \
          || gh release upload "$GITHUB_REF_NAME" --clobber hello.wasm hello.wasm.sha256
        env:
          GH_TOKEN: ${{ github.token }}

      # Publishes @perfscale/library-sdk to npm via trusted publishing: the
      # workflow authenticates with its OIDC token (no long-lived npm token
      # anywhere) and the package carries a provenance attestation. The
      # binding lives on npmjs.com → package settings → Trusted Publisher →
      # GitHub Actions: Perfscale/sdk-libraries, workflow release.yml.
      # Requires npm ≥ 11.5.1 (hence the npm@latest upgrade).
      - name: Publish @perfscale/library-sdk to npm
        run: |
          npm install -g npm@latest
          npm publish --access public --provenance
