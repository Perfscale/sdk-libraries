name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run example:build
      - name: Checksums
        working-directory: ts/examples/hello
        run: shasum -a 256 hello.wasm > hello.wasm.sha256
      - name: Attach the example component to the GitHub release
        working-directory: ts/examples/hello
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            hello.wasm hello.wasm.sha256 \
          || gh release upload "$GITHUB_REF_NAME" --clobber hello.wasm hello.wasm.sha256
        env:
          GH_TOKEN: ${{ github.token }}

      # Publishes @perfscale/library-sdk to npm. Auth: NPM_TOKEN repo secret
      # (granular access token for the @perfscale scope), picked up via the
      # setup-node registry-url above. Scoped packages need --access public.
      - name: Publish @perfscale/library-sdk to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
