name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      # Supply-chain gate: the SDK ships zero runtime dependencies today —
      # keep it that way by failing on any high-severity advisory in the
      # production dependency surface.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: Componentize the example library
        run: npm run example:build
      - name: Inspect component imports/exports
        run: npx jco wit examples/hello/hello.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hello-wasm
          path: ts/examples/hello/hello.wasm
          retention-days: 7

  go-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/examples/hello
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # TinyGo 0.42 builds against Go 1.25–1.27 — keep in range.
          go-version: "1.25"
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3
        with:
          tinygo-version: "0.42.0"
      - name: Install wasm-tools and binaryen (pinned)
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.261.0/wasm-tools-1.261.0-x86_64-linux.tar.gz \
            | tar -xz --strip-components=1 -C "$HOME/.local/bin" --wildcards '*/wasm-tools'
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz \
            | tar -xz --strip-components=2 -C "$HOME/.local/bin" --wildcards '*/bin/wasm-opt'
          wasm-tools --version && wasm-opt --version
      # Bindings under internal/gen are committed — no codegen here.
      - run: go build ./...
      - name: Componentize the Go example library
        # build.sh re-worlds the component to perfscale:library/library and
        # strips the wasi:random imports TinyGo's runtime links — see
        # go/README.md ("Building") for why plain tinygo build is not enough.
        run: ./build.sh
      - name: Assert component shape (export + no wasi:random)
        run: |
          wasm-tools component wit hello.wasm | grep -q 'export perfscale:library/library@0.1.0'
          ! wasm-tools component wit hello.wasm | grep -q 'wasi:random'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hello-go-wasm
          path: go/examples/hello/hello.wasm
          retention-days: 7

  integration:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hello-wasm
          path: ts/examples/hello/
      # TODO(engine): the examples are pure (no `capabilities:` grant) and
      # need an engine that honors info().pure — bump to the release
      # honoring info().pure (Perfscale/perfscale > v0.23.0) once released.
      # Until then the run steps below are expected to fail (fail-closed).
      - name: Download perfscale v0.23.0 (linux-amd64)
        run: |
          curl -fsSL -o perfscale-linux-amd64 \
            https://github.com/Perfscale/perfscale/releases/download/v0.23.0/perfscale-linux-amd64
          curl -fsSL https://github.com/Perfscale/perfscale/releases/download/v0.23.0/sha256sums.txt \
            | grep linux-amd64 | sha256sum -c --ignore-missing
          mv perfscale-linux-amd64 perfscale
          chmod +x perfscale
          ./perfscale --version
      - name: Run the example through the engine
        working-directory: ts/examples/hello
        run: "$GITHUB_WORKSPACE/perfscale run -f hello.test.yaml -c hello.config.yaml"
      - name: Assert token expansion
        working-directory: ts/examples/hello
        run: |
          cat hello-out.txt
          grep -q 'greeting: hello, world!' hello-out.txt

  integration-go:
    needs: go-example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hello-go-wasm
          path: go/examples/hello/
      # TODO(engine): same as the `integration` job — bump to the release
      # honoring info().pure (Perfscale/perfscale > v0.23.0) once released.
      - name: Download perfscale v0.23.0 (linux-amd64)
        run: |
          curl -fsSL -o perfscale-linux-amd64 \
            https://github.com/Perfscale/perfscale/releases/download/v0.23.0/perfscale-linux-amd64
          curl -fsSL https://github.com/Perfscale/perfscale/releases/download/v0.23.0/sha256sums.txt \
            | grep linux-amd64 | sha256sum -c --ignore-missing
          mv perfscale-linux-amd64 perfscale
          chmod +x perfscale
          ./perfscale --version
      - name: Run the Go example through the engine
        working-directory: go/examples/hello
        run: "$GITHUB_WORKSPACE/perfscale run -f hello.test.yaml -c hello.config.yaml"
      - name: Assert token expansion matches the TS example
        working-directory: go/examples/hello
        run: |
          cat hello-out.txt
          # The token varies between runs (per-instance PRNG stream), so assert
          # the greeting and the memo invariant (token == again), not a literal.
          grep -q 'greeting: hello, world!' hello-out.txt
          awk -F'token: |; again: ' '$2 != $3 { exit 1 }' hello-out.txt
