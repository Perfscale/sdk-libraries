# Local e2e for the example component:
#   perfscale run -f examples/hello/hello.test.yaml -c examples/hello/hello.config.yaml
# `capabilities: []` — explicit no-grants declaration; required by perfscale ≥
# the upcoming release. The component is pure (info() reports `"pure": true`),
# so engines honoring the pure marker waive the fs grant that jco's
# unconditional wasi:filesystem/wall-clock imports used to need.
libraries:
  - use: ./hello.wasm
    capabilities: []
steps:
  - name: greet
    use: std/file-write@v1
    with:
      path: hello-out.txt
      content: "greeting: ${hello.greet(world)}; token: ${hello.token(order)}; again: ${hello.token(order)}"
