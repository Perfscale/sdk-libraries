# Local e2e for the Go example component:
#   perfscale run -f examples/hello/hello.test.yaml -c examples/hello/hello.config.yaml
# No `capabilities:` grant — the component is pure (info() reports
# `"pure": true`), so engines honoring the pure marker waive the fs grant.
libraries:
  - use: ./hello.wasm
steps:
  - name: greet
    use: std/file-write@v1
    with:
      path: hello-out.txt
      content: "greeting: ${hello.greet(world)}; token: ${hello.token(order)}; again: ${hello.token(order)}"
